  const vg = o.createLinearGradient(0, 0, 0, oh); ['rgba(8,3,0,.35)', 'rgba(8,3,0,0)', 'rgba(8,3,0,0)', 'rgba(5,2,0,.5)', 'rgba(3,1,0,.92)'].forEach((s, i, a) => vg.addColorStop(i / (a.length - 1), s));

  const g = o.createRadialGradient(ow / 2, -oh * .1, 0, ow / 2, -oh * .1, oh * .9); g.addColorStop(0, 'rgba(255,210,150,.12)'); g.addColorStop(1, 'rgba(255,210,150,0)'); o.fillStyle = g; o.fillRect(0, 0, ow, oh);
}
function resizeCanvas() { RS = DPR * CL[cl].cs; cv.width = Math.round(W * RS); cv.height = Math.round(H * RS); buildOverlay(); }

// ---------- Alice's contemplations (Alice's Adventures in Wonderland, 1865) ----------
const QUOTES = [
  "Well! after such a fall as this, I shall think nothing of tumbling down stairs!",
  "How brave they'll all think me at home!",
  "I wonder how many miles I've fallen by this time?",
  "I must be getting somewhere near the centre of the earth. Let me see: that would be four thousand miles down, I think—",
  "I wonder what Latitude or Longitude I've got to?",
  "I wonder if I shall fall right through the earth!",

  "Dinah'll miss me very much to-night, I should think!",
  "I hope they'll remember her saucer of milk at tea-time.",
  "Dinah my dear! I wish you were down here with me!",
  "There are no mice in the air, I'm afraid, but you might catch a bat, and that's very like a mouse, you know.",
  "Do cats eat bats? Do cats eat bats?",
  "Do bats eat cats?",
  "What is the use of a book without pictures or conversations?",
  "Curiouser and curiouser!",
  "Who in the world am I? Ah, that's the great puzzle!",
  "Let me see: four times five is twelve, and four times six is thirteen…",
  "London is the capital of Paris, and Paris is the capital of Rome, and Rome—no, that's all wrong, I'm certain!",

  "I almost wish I hadn't gone down that rabbit-hole—and yet—and yet—it's rather curious, you know, this sort of life!",
  "I've often seen a cat without a grin, but a grin without a cat! It's the most curious thing I ever saw in my life!",
  "I can't go back to yesterday, because I was a different person then.",

let qOrder = [], qi = 0, nextQuoteMile = .12, quote = null, qT = 0, qDur = 0;
function shuffleQuotes() { qOrder = QUOTES.map((_, i) => i); for (let i = qOrder.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [qOrder[i], qOrder[j]] = [qOrder[j], qOrder[i]]; } qi = 0; }
function wrap(text, maxW) { const words = text.split(' '), lines = []; let line = ''; for (const wd of words) { const t = line ? line + ' ' + wd : wd; if (X.measureText(t).width > maxW && line) { lines.push(line); line = wd; } else line = t; } if (line) lines.push(line); return lines; }
function drawQuote(dt, miles) {
  if (miles >= nextQuoteMile && (!quote || qT > qDur)) {
    if (qi >= qOrder.length) shuffleQuotes();

  X.save(); X.globalAlpha = a; X.font = `italic ${sz}px ${FONT}`; X.textAlign = 'center'; X.textBaseline = 'middle';
  X.shadowColor = 'rgba(0,0,0,.95)'; X.shadowBlur = 10 * RS; X.fillStyle = '#f6e8c8';
  const lines = wrap(`“${quote}”`, Math.min(W * .78, 760) * RS), lh = sz * 1.35, y0 = cv.height * .74 - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => X.fillText(l, cv.width / 2, y0 + i * lh));
  X.restore();
}
function drawHud(dt, miles) {
  if (stats) {
    X.save(); X.font = `${12 * RS}px monospace`; X.fillStyle = '#f3e3c0'; X.shadowColor = '#000'; X.shadowBlur = 4 * RS;
    const L = TL[tl];
    X.fillText(`${(1000 / frameEma).toFixed(0)} fps · wall ${Math.round(L.qx * 100)}×${Math.round(L.qy * 100)}%${L.soft ? '' : ' hard-shadow'} · screen ${Math.round(CL[cl].cs * 100)}% blur ${CL[cl].blur} · ${fullCost.toFixed(0)}ms/tile · ${local ? 'main thread' : 'worker'}`, 12 * RS, 20 * RS);
    X.restore();
  }
  hud -= dt; if (hud <= 0) return;
  const a = Math.min(1, hud), s = RS, px = 22 * s, py = TOUCH ? 62 * s : cv.height - 22 * s; // top on phones, clear of the buttons
  X.save(); X.globalAlpha = a * .9; X.textAlign = 'left'; X.textBaseline = 'alphabetic';
  X.shadowColor = 'rgba(0,0,0,.9)'; X.shadowBlur = 6 * s; X.fillStyle = '#f3e3c0';
  X.font = `italic ${15 * s}px ${FONT}`; X.fillText(`${miles.toFixed(2)} miles down`, px, py - 22 * s);
  X.font = `${12.5 * s}px ${FONT}`;
  const st = paused ? 'paused' : 'falling ×' + (target / BASE_SPEED).toFixed(1) + (auto && target < MAX_SPEED ? ' and speeding up' : '');
  if (TOUCH) { X.fillText(st, px, py); X.fillText('swipe up/down: speed  ·  tap: controls', px, py + 18 * s); }
  else X.fillText(`${st}   ·   ↑ / ↓ or wheel: speed   ·   space: pause   ·   N: a new well   ·   Q: stats`, px, py);
  X.restore();
}

// ---------- adaptive quality ----------
let frameEma = 16.7, vsync = 16.7, vsMin = 1e9, vsT = 0, slowT = 0, fastT = 0, upNeed = 4, lastUp = -1e9, tlHold = 0, lastMissPenalty = 0;
function control(dtRaw, v, now, missing) {
  if (dtRaw > 0 && dtRaw < 250) { frameEma = frameEma * .92 + dtRaw * .08; vsMin = Math.min(vsMin, dtRaw); }
  if (now - vsT > 2000) { if (vsMin < 1e8) vsync = clamp(vsMin, 4, 34); vsMin = 1e9; vsT = now; }
  // screen canvas / blur: driven by main-thread frame time
  const s = Math.min(dtRaw, 100) / 1000;
  if (frameEma > Math.max(vsync * 1.35, 19)) { slowT += s; fastT = 0; }
  else if (frameEma < Math.max(vsync * 1.12, 17.6)) { fastT += s; slowT = Math.max(0, slowT - s); }
  else slowT = Math.max(0, slowT - s);
  if (slowT > 1 && cl < CL.length - 1) { cl++; slowT = 0; if (now - lastUp < 10000) upNeed = Math.min(30, upNeed * 2); resizeCanvas(); }
  else if (fastT > upNeed && cl > 0) { cl--; fastT = 0; lastUp = now; resizeCanvas(); }

  if (missing && now - lastMissPenalty > 700) { fullCost *= 1.35; lastMissPenalty = now; }
  const demand = v / TILE, thr = local ? .25 : .6, thrUp = local ? .18 : .45;
  let want = TL.length - 1;
  for (let l = 0; l < TL.length; l++) if (demand * fullCost * costF(l) / 1000 <= thr) { want = l; break; }
  if (want > tl) { tl = want; tlHold = now; }
  else if (want < tl && now - tlHold > 1200) {
    let up = tl; while (up > 0 && demand * fullCost * costF(up - 1) / 1000 <= thrUp) up--;
    if (up < tl) { tl = up; tlHold = now; }
  }
}

// ---------- main loop ----------
function setup() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = document.documentElement.clientWidth || window.innerWidth; H = document.documentElement.clientHeight || window.innerHeight;
  U = clamp(W / 1400, .6, 1.15); LW = 2.2 * U + .5;
  resizeCanvas();
  offset = (parseFloat(new URLSearchParams(location.search).get('depth')) || 0) * U * MILE;
  nextQuoteMile = offset / (U * MILE) + .12; quote = null; shuffleQuotes();
  if (worker) reinit();
}
function drawTiles(off) {
  let missing = false; const first = Math.floor(off / TILE), lastI = Math.floor((off + H) / TILE);
  for (let i = first; i <= lastI; i++) {
    const y = Math.round((i * TILE - off) * RS), h2 = Math.round(((i + 1) * TILE - off) * RS) - y, t = tiles.get(i);
    if (t) X.drawImage(t.bmp, 0, y, cv.width, h2); else { X.fillStyle = '#160b06'; X.fillRect(0, y, cv.width, h2); missing = true; }
  }
  return missing;
}
function frame(now) {
  const dtRaw = now - last, dt = Math.min(.05, dtRaw / 1000); last = now;
  if (auto && !paused) { autoT += dt; target = Math.min(MAX_SPEED, BASE_SPEED * Math.exp(AUTO_K * autoT)); }
  speed += ((paused ? 0 : target) - speed) * Math.min(1, dt * 2.5);
  const v = speed * U; offset += v * dt;
  if (ready) {
    const first = Math.floor(offset / TILE), lastV = Math.floor((offset + H) / TILE), ahead = 2 + Math.ceil(v * 1.1 / TILE);
    if (minSent !== first - 1) { worker.postMessage({ type: 'min', idx: first - 1 }); minSent = first - 1; }
    for (let i = first; i <= lastV + ahead; i++) {
      const t = tiles.get(i), p = pending.get(i);
      if (!t) { if (p === undefined || p < tl - 1) request(i); } // missing (or queued at a quality we can no longer afford)
      else if (t.level > tl && p === undefined && pending.size < 2) request(i); // upgrade when there's headroom
    }
    for (const [k, t] of tiles) if (k < first - 1 || k > lastV + ahead + 3) { if (t.bmp.close) t.bmp.close(); tiles.delete(k); }
    for (const k of pending.keys()) if (k < first - 1) pending.delete(k);
  }
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1;
  const missing = drawTiles(offset);
  const blur = Math.min(v * dt * 1.1, 24 * U), n = Math.max(1, Math.min(CL[cl].blur, Math.ceil(blur / (6 * U)))); // closely spaced samples: a smear, not ghost copies
  for (let i = 1; i < n; i++) { X.globalAlpha = 1 / (i + 1); drawTiles(offset - blur * i / n); }
  X.globalAlpha = 1; X.drawImage(overlay, 0, 0);
  const miles = offset / (U * MILE);
  drawQuote(dt, miles); drawHud(dt, miles);
  control(dtRaw, v, now, missing && ready && now > 3000);
  requestAnimationFrame(frame);
}

// ---------- controls: keyboard, wheel, touch ----------
function faster() { auto = false; target = Math.min(MAX_SPEED, Math.max(40, target * 1.3)); paused = false; hud = 3; syncBar(); }
function slower() { auto = false; target = Math.max(40, target / 1.3); hud = 3; }
function togglePause() { paused = !paused; hud = 3; syncBar(); }
function newWell() { seed = (Math.random() * 2 ** 31) | 0; offset = 0; if (auto) { autoT = 0; target = BASE_SPEED; } nextQuoteMile = .12; quote = null; reinit(); hud = 3; }
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') { faster(); e.preventDefault(); }
  else if (e.key === 'ArrowDown' || e.key === '-' || e.key === '_') { slower(); e.preventDefault(); }
  else if (e.key === ' ') { togglePause(); e.preventDefault(); }
  else if (e.key === 'n' || e.key === 'N') newWell();
  else if (e.key === 'q' || e.key === 'Q') stats = !stats;
  else hud = 3;
});
window.addEventListener('wheel', e => { e.deltaY > 0 ? faster() : slower(); }, { passive: true });
const bar = document.getElementById('bar'); let barT = null;
function showBar() { bar.classList.add('on'); clearTimeout(barT); barT = setTimeout(() => bar.classList.remove('on'), 3500); }
const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6v12M15 6v12"/></svg>', ICON_PLAY = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>';
function syncBar() { document.getElementById('bp').innerHTML = paused ? ICON_PLAY : ICON_PAUSE; }
syncBar();
bar.addEventListener('pointerdown', e => {
  e.stopPropagation(); const b = e.target.closest('button'); if (!b) return; showBar();
  ({ slower, faster, pause: togglePause, newwell: newWell })[b.dataset.a]();
});
let sy0 = null, st0 = 0, swiped = false; const touchIds = new Set();
const zoomed = () => !!(window.visualViewport && window.visualViewport.scale > 1.02);
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { cv.style.touchAction = zoomed() ? 'auto' : 'pinch-zoom'; }); // zoomed in: let the finger pan instead
cv.addEventListener('pointerdown', e => { touchIds.add(e.pointerId); if (touchIds.size > 1 || zoomed()) { sy0 = null; return; } sy0 = e.clientY; st0 = performance.now(); swiped = false; });

  if (sy0 === null || touchIds.size > 1) return; const dy = e.clientY - sy0;

requestAnimationFrame(frame);
})();
